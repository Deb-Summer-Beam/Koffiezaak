<!-- 01: a note whose text gets bigger on wide screens.
     Done when: narrower than 600px the text is normal size; 600px or wider it is twice as big
     (drag the browser window narrower, or DevTools → device toolbar). -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Big note</title>
  <link rel="stylesheet" href="01-big-note.css">
</head>
<body>
  <p class="note">The coffee is ready.</p>
</body>
</html>
