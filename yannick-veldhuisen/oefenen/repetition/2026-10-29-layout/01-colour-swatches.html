<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Colour swatches</title>
  <link rel="stylesheet" href="01-colour-swatches.css">
</head>
<body>
  <!-- 01 · Six colour swatches in a grid.
       Done when: 2 rows of 3 equally wide swatches, with space between them (not around the outside).
       Only the CSS file has a blank. -->
  <div class="palette">
    <div class="swatch">Red</div>
    <div class="swatch">Orange</div>
    <div class="swatch">Yellow</div>
    <div class="swatch">Green</div>
    <div class="swatch">Blue</div>
    <div class="swatch">Purple</div>
  </div>
</body>
