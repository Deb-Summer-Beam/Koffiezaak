<!DOCTYPE html>
<!--
  What it does: a short list of books on the reading pile.
  Done when: the tab says "My books", the heading is dark green (from 02-book-list.css),
  and in device mode (375px wide) the text is normal reading size.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="02-book-list.css">
  <!-- ⬜ three lines here: the character set, the viewport, the link to 02-book-list.css -->
  <title>My books</title>
</head>
<body>
  <h1>Reading pile</h1>
  <ul>
    <li>The Hobbit</li>
    <li>Dune</li>
    <li>Project Hail Mary</li>
  </ul>
</body>
</html>
