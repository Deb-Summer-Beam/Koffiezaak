<!--
  What it does: a page that shows one line: "Next train to Utrecht: 16:42".
  Build the whole page from blank, including the full <head>.
  Done when: the page language is English, the tab says "Train times", the background is light blue
  (from your own rule in 03-train-times.css, linked in the head), and in device mode (375px wide)
  the text is normal reading size.
-->
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="03-train-times.css">
  <title>Train times</title>
</head>

<body>
  <p>Next train to Utrecht: 16:42</p>

</body>

</html>
