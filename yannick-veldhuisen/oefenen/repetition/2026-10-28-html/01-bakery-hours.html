<!DOCTYPE html>
<!--
  What it does: a tiny page with a bakery's opening hours.
  Done when: the tab says "Bakery hours", the background is cream (from 01-bakery-hours.css),
  and in DevTools device mode (Ctrl+Shift+M, 375px wide) the text is normal reading size, not tiny.
-->
<!-- why: lang tells screen readers and translators which language the page is in -->
<html lang="en">
<head>
  <!-- why: UTF-8 so characters like é and € show up correctly -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bakery hours</title>
  <!-- why: rel says WHAT (relation) the linked file is, href says WHERE it is -->
  <link rel="stylesheet" href="01-bakery-hours.css">
</head>
<body>
  <h1>Opening hours</h1>
  <p>Monday to Saturday, 07:00 – 18:00</p>
</body>
</html>
